services:
  postgres:
    image: postgres:16
    container_name: 7mata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: 7mata
      POSTGRES_PASSWORD: 7mata_dev
      POSTGRES_DB: 7mata
    ports:
      - "5432:5432"
    volumes:
      - 7mata_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 7mata -d 7mata"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: 7mata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - 7mata_redis:/data
    command: redis-server --appendonly yes

volumes:
  7mata_postgres:
  7mata_redis:
